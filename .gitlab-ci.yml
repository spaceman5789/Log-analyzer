# GitLab CI/CD for log-analyzer
#
#   lint     → ruff (style and errors)
#   test     → pytest on Python 3.10–3.13, coverage and JUnit report in the GitLab UI, CLI smoke test
#   security → bandit (code SAST) + gitleaks (secrets across the entire git history)
#   build    → wheel + Docker image, check that the container does not run as root
#   deploy   → publish the image to GitLab Container Registry (main and v* tags)

stages:
  - lint
  - test
  - security
  - build
  - deploy

# One pipeline per event: MR pipeline for merge requests, no duplicate branch pipeline
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

default:
  interruptible: true # a new push cancels the outdated pipeline

.python:
  image: python:3.12-slim
  cache:
    key: pip-$CI_JOB_IMAGE
    paths:
      - .cache/pip

# --- lint ----------------------------------------------------------------------

ruff:
  extends: .python
  stage: lint
  script:
    - pip install ruff
    # Code Quality report is shown right in the merge request
    - ruff check --output-format=gitlab . > gl-code-quality-report.json || (ruff check . ; exit 1)
    - ruff format --check .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

# --- test ----------------------------------------------------------------------

pytest:
  extends: .python
  stage: test
  image: python:${PYTHON_VERSION}-slim
  needs: []
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  script:
    - pip install -e ".[dev]"
    - pytest --cov=log_analyzer --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
    # smoke test: the CLI installs and finds attacks in the demo log
    - log-analyzer generate -o demo.log
    - log-analyzer analyze demo.log -c config.example.yaml
    - log-analyzer analyze demo.log --format json > report.json
    - python -c "import json; assert json.load(open('report.json'))['alerts']"
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# --- security ------------------------------------------------------------------

bandit:
  extends: .python
  stage: security
  needs: []
  script:
    - pip install bandit
    - bandit -r src -c pyproject.toml -f json -o bandit.json --exit-zero
    - bandit -r src -c pyproject.toml # fails if issues are found
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - bandit.json

gitleaks:
  stage: security
  needs: []
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0 # full history: a secret removed in a new commit may remain in an old one
  script:
    - gitleaks detect --source . --verbose --redact --report-format json --report-path gitleaks.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - gitleaks.json

# --- build ---------------------------------------------------------------------

wheel:
  extends: .python
  stage: build
  needs: [pytest]
  script:
    - pip wheel --no-deps --wheel-dir dist .
  artifacts:
    expire_in: 1 month
    paths:
      - dist/*.whl

.docker:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

docker-build:
  extends: .docker
  stage: build
  needs: [pytest]
  script:
    - docker build --pull -t "$IMAGE" .
    # the container must not run as root
    - test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = "10001"
    # the image works: generate a demo log and analyze it inside the container
    - docker run --rm "$IMAGE" generate > demo.log
    - docker run --rm -v "$PWD/demo.log:/logs/auth.log:ro" "$IMAGE" analyze /logs/auth.log
    - docker save "$IMAGE" -o image.tar
  artifacts:
    expire_in: 1 day
    paths:
      - image.tar

# --- deploy: image to GitLab Container Registry ---------------------------------

docker-publish:
  extends: .docker
  stage: deploy
  needs: [docker-build, bandit, gitleaks]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then TAG="${CI_COMMIT_TAG#v}"; else TAG=latest; fi
      docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:$TAG"
      docker push "$IMAGE"
      docker push "$CI_REGISTRY_IMAGE:$TAG"
  environment:
    name: registry
    url: $CI_PROJECT_URL/container_registry
