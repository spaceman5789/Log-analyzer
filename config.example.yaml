# Example log-analyzer config. Copy to config.yaml and adjust:
#   log-analyzer analyze /var/log/auth.log -c config.yaml
# CLI flags (--window, --threshold, --cooldown, --allow) take precedence over the config.

detection:
  # Brute force: >= threshold failed passwords from one IP within window seconds
  # (like maxretry / findtime in fail2ban)
  window: 60
  threshold: 5
  # Successful login from an IP with >= threshold failures in the last success_lookback seconds → CRITICAL
  success_lookback: 3600
  # Password spraying (T1110.003): >= spray_users distinct usernames from one IP within spray_window
  spray_window: 3600
  spray_users: 5
  # Distributed attack: >= distributed_ips distinct IPs on one username within distributed_window
  distributed_window: 600
  distributed_ips: 5
  # Scanners (LOW): >= scan_threshold [preauth] disconnects / Invalid user from an IP within window
  scan_threshold: 10
  # Deduplication: an attack with no gap longer than cooldown is one alert, not 700 messages
  cooldown: 900
  # Brute force against these usernames raises severity to HIGH
  privileged_users: [root]

# Trusted IPs and subnets: no alerts from them (false positive control).
allowlist:
  - 192.0.2.10/32     # admin workstation
  - 10.0.5.0/24       # CI runners (one hits SSH with a broken key every 10 seconds)
  - 127.0.0.1
  - ::1

telegram:
  # Send only important alerts to Telegram, the rest is in the report
  min_severity: HIGH
  # If one analyze run has more, the rest go out as one summary
  max_alerts: 10
  timeout: 10

enrichment:
  # IP country: download GeoLite2-Country.mmdb from maxmind.com and pip install '.[geoip]'
  geoip_db: null
  # Public blocklists (one IP/CIDR per line), e.g. FireHOL level1:
  # curl -o firehol_level1.netset https://iplists.firehol.org/files/firehol_level1.netset
  blocklists: []
